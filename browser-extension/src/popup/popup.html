<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScrollLater</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 512 512" fill="none">
          <rect width="512" height="512" rx="96" fill="url(#grad)"/>
          <defs>
            <linearGradient id="grad" x1="0" y1="0" x2="512" y2="512">
              <stop offset="0%" style="stop-color:#f97316"/>
              <stop offset="100%" style="stop-color:#ea580c"/>
            </linearGradient>
          </defs>
          <g fill="white">
            <rect x="120" y="140" width="272" height="32" rx="8"/>
            <rect x="120" y="200" width="220" height="24" rx="6" opacity="0.8"/>
            <circle cx="376" cy="372" r="48" fill="white"/>
            <path d="M376 340 L376 404 M344 372 L408 372" stroke="#f97316" stroke-width="12" stroke-linecap="round"/>
          </g>
        </svg>
        <span>ScrollLater</span>
      </div>
      <button id="settings-btn" class="icon-btn" title="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <!-- Auth View -->
    <div id="auth-view" class="view">
      <div class="auth-content">
        <h2>Sign in to ScrollLater</h2>
        <p>Save articles, videos, and content to read later.</p>
        <button id="sign-in-btn" class="btn btn-primary">
          Sign in with Google
        </button>
        <a href="https://scrolllater.com" target="_blank" class="link">Create an account</a>
      </div>
    </div>

    <!-- Main View -->
    <div id="main-view" class="view hidden">
      <!-- Page Preview -->
      <div id="page-preview" class="page-preview">
        <div class="preview-loading">
          <div class="spinner"></div>
          <span>Loading page info...</span>
        </div>
      </div>

      <!-- Save Form -->
      <div class="save-form">
        <div class="form-group">
          <label for="notes">Notes (optional)</label>
          <textarea id="notes" placeholder="Add a note about this page..."></textarea>
        </div>

        <div class="form-group">
          <label for="tags">Tags</label>
          <input type="text" id="tags" placeholder="Add tags separated by commas">
        </div>

        <div class="form-group">
          <label>Priority</label>
          <div class="priority-selector">
            <button class="priority-btn" data-priority="1">Low</button>
            <button class="priority-btn active" data-priority="3">Medium</button>
            <button class="priority-btn" data-priority="5">High</button>
          </div>
        </div>

        <button id="save-btn" class="btn btn-primary btn-large">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
          </svg>
          Save to ScrollLater
        </button>
      </div>

      <!-- Success Message -->
      <div id="success-message" class="success-message hidden">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <h3>Saved!</h3>
        <p>Content added to your inbox</p>
        <a href="https://scrolllater.com/dashboard" target="_blank" class="link">View in Dashboard</a>
      </div>

      <!-- Error Message -->
      <div id="error-message" class="error-message hidden">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="15" y1="9" x2="9" y2="15"></line>
          <line x1="9" y1="9" x2="15" y2="15"></line>
        </svg>
        <h3>Error</h3>
        <p id="error-text">Failed to save. Please try again.</p>
        <button id="retry-btn" class="btn btn-secondary">Try Again</button>
      </div>
    </div>

    <!-- Settings View -->
    <div id="settings-view" class="view hidden">
      <div class="settings-header">
        <button id="back-btn" class="icon-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>
        <h2>Settings</h2>
      </div>

      <div class="settings-content">
        <div class="setting-item">
          <label>
            <input type="checkbox" id="floating-button">
            <span>Show floating save button on pages</span>
          </label>
        </div>

        <div class="setting-item">
          <label>
            <input type="checkbox" id="auto-extract">
            <span>Auto-extract article content</span>
          </label>
        </div>

        <div class="setting-item">
          <label>
            <input type="checkbox" id="notifications">
            <span>Show save notifications</span>
          </label>
        </div>

        <div class="setting-item">
          <label for="api-url">API URL (advanced)</label>
          <input type="text" id="api-url" placeholder="https://scrolllater.com">
        </div>

        <button id="sign-out-btn" class="btn btn-danger">Sign Out</button>
      </div>
    </div>

    <!-- User Info -->
    <div id="user-info" class="user-info hidden">
      <img id="user-avatar" src="" alt="Avatar">
      <span id="user-name"></span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
